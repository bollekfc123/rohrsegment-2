<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<title>Rohr-Schnitt Rechner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:14px 12px 40px}
.card{background:#fff;border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 4px 18px #0000000d}
h1{font-size:26px;margin:0 0 3px}.sub{margin:0;color:#64748b;font-size:14px}
h2{font-size:19px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:750;margin:0 0 6px;color:#334155}
input,select,button{width:100%;min-height:48px;border-radius:13px;border:1px solid #cbd5e1;padding:11px 12px;font:inherit;background:#fff}
input:focus,select:focus{outline:3px solid #bfdbfe;border-color:#3b82f6}
button{border:0;background:#0f172a;color:#fff;font-weight:750;cursor:pointer}
button.secondary{background:#e2e8f0;color:#0f172a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f8fafc;border-radius:14px;padding:13px}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:#64748b}
.chartbox{background:#f8fafc;border-radius:15px;padding:8px;overflow:hidden}
canvas{display:block;width:100%;height:240px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:330px}
th,td{padding:9px 7px;border-bottom:1px solid #e2e8f0;text-align:right}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:#64748b}
.highlight{font-weight:800}.hint{font-size:12px;color:#64748b;line-height:1.45}
@media(max-width:520px){.grid,.statgrid{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.no-print{display:none!important}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Rohr-Schnitt Rechner</h1>
<p class="sub">Schnittlinie für ein rundes Rohr berechnen</p>
</div>

<div class="card">
<h2>Eingaben</h2>
<div class="grid">
<div><label>Winkel</label><input id="angle" type="number" value="2" step="0.01" min="0"></div>
<div><label>Durchmesser (mm)</label><input id="diameter" type="number" value="800" step="1" min="1"></div>
<div><label>Abstand (mm)</label><input id="spacing" type="number" value="100" step="1" min="1"></div>
<div><label>Nullpunkt</label><select id="start"><option value="high">höchster Punkt</option><option value="low">tiefster Punkt</option></select></div>
</div>
<div class="actions no-print">
<button onclick="window.print()">Drucken</button>
<button class="secondary" onclick="resetApp()">Zurücksetzen</button>
</div>
</div>

<div class="card">
<h2>Ergebnis</h2>
<div class="statgrid">
<div class="stat"><span>Rohrumfang</span><b id="circ">–</b></div>
<div class="stat"><span>max. Höhenunterschied</span><b id="max">–</b></div>
</div>
</div>

<div class="card">
<h2>Schnittlinie rund ums Rohr</h2>
<div class="chartbox"><canvas id="chart"></canvas></div>
<p class="hint">Waagerecht: Weg um den Rohrumfang. Senkrecht: Höhe der Schnittlinie ab Nullpunkt.</p>
</div>

<div class="card">
<h2>Anreißtabelle</h2>
<div class="tablewrap">
<table><thead><tr><th>Abstand</th><th>Höhe</th></tr></thead><tbody id="rows"></tbody></table>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
function values(){
 const a=+$('angle').value||0,d=+$('diameter').value||1,s=+$('spacing').value||1;
 const c=Math.PI*d,r=d/2,t=Math.tan(a*Math.PI/180);
 return {a,d,s,c,r,t,start:$('start').value};
}
function heightAt(x,v){
 let theta=x/v.c*2*Math.PI;
 let y=v.r*(1-Math.cos(theta))*v.t;
 if(v.start==='low') y=v.d*v.t-y;
 return y;
}
function calculate(){
 const v=values();
 $('circ').textContent=v.c.toFixed(1)+" mm";
 $('max').textContent=(v.d*v.t).toFixed(2)+" mm";
 const rows=$('rows');rows.innerHTML='';
 for(let x=0;x<=v.c+0.0001;x+=v.s){
   x=Math.min(x,v.c);
   let tr=document.createElement('tr');
   tr.innerHTML=`<td>${x.toFixed(1)} mm</td><td class="highlight">${heightAt(x,v).toFixed(2)} mm</td>`;
   rows.appendChild(tr);
   if(x>=v.c)break;
 }
 draw(v);
}
function draw(v){
 const c=$('chart'),dpr=devicePixelRatio||1,w=c.clientWidth,h=240;
 c.width=w*dpr;c.height=h*dpr;
 const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
 const pad={l:42,r:12,t:15,b:32}, pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
 const max=Math.max(v.d*v.t,0.1);
 ctx.strokeStyle="#cbd5e1";ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,h-pad.b);ctx.lineTo(w-pad.r,h-pad.b);ctx.stroke();
 ctx.strokeStyle="#0f172a";ctx.lineWidth=2.5;ctx.beginPath();
 for(let i=0;i<=200;i++){
   let x=v.c*i/200,y=heightAt(x,v);
   let px=pad.l+pw*x/v.c,py=h-pad.b-ph*y/max;
   i?ctx.lineTo(px,py):ctx.moveTo(px,py);
 }
 ctx.stroke();
 ctx.fillStyle="#475569";ctx.font="11px system-ui";
 ctx.fillText("0",pad.l-18,h-pad.b+4);ctx.fillText(v.c.toFixed(0)+" mm",w-pad.r-45,h-pad.b+18);
 ctx.fillText("0 mm",4,h-pad.b+4);ctx.fillText(max.toFixed(1)+" mm",2,pad.t+4);
}
function resetApp(){
 $('angle').value=2;$('diameter').value=800;$('spacing').value=100;$('start').value='high';calculate();
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calculate));
window.addEventListener('resize',calculate);calculate();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
